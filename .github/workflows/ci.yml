name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint every PHP file that SHIPS, on every PHP version the plugin supports.
  #
  # The file list comes from bin/shipped-php-files.sh, the same script the release
  # gate reads. CI writing its own `find` would reintroduce exactly the drift this
  # plugin just paid for: the release gate's hand-written 'includes/**/*.php'
  # pathspec silently skipped includes/Plugin.php and includes/Autoloader.php, so
  # the two files where a parse error is a white screen were never linted.
  lint:
    name: PHP Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint shipped PHP
        run: |
          fail=0
          count=0
          while IFS= read -r -d '' f; do
            count=$(( count + 1 ))
            php -l "$f" >/dev/null 2>/tmp/lint.err || { echo "::error file=$f::$(cat /tmp/lint.err)"; fail=1; }
          done < <(bin/shipped-php-files.sh)
          # A gate that inspects nothing passes. Fail loudly instead.
          if [ "$count" -eq 0 ]; then
            echo "::error::bin/shipped-php-files.sh returned no files - the allowlist is broken"
            exit 1
          fi
          echo "linted $count shipped PHP file(s)"
          exit $fail

  # WPCS. There is no composer.json in this repo (no runtime deps, hand-written
  # PSR-4 autoloader), so the standard is installed here rather than borrowed from
  # the sibling BuddyNext checkout the way a developer does locally.
  #
  # ERRORS fail the build; WARNINGS do not. phpcs exits non-zero on either, and
  # there are known pre-existing warnings in VerifyService that CLAUDE.md
  # explicitly tells contributors not to adopt - blocking on those would mean every
  # PR either bypasses the gate or carries an unrelated cleanup.
  #
  # No path argument: .phpcs.xml.dist already declares <file>.</file> with docker/
  # and vendor/ excluded, so the ruleset owns the scope. Passing a path here would
  # override it and silently drop the entry file and templates/.
  wpcs:
    name: WPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, cs2pr
          coverage: none

      - name: Install WordPress Coding Standards
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            wp-coding-standards/wpcs:"^3.1" \
            phpcompatibility/phpcompatibility-wp:"^2.1"
          echo "$HOME/.composer/vendor/bin" >> "$GITHUB_PATH"

      - name: Run WPCS
        run: phpcs --standard=.phpcs.xml.dist --runtime-set ignore_warnings_on_exit 1 --report-full --report-checkstyle=/tmp/phpcs.xml || true

      - name: Annotate PR with WPCS findings
        if: always()
        run: cs2pr --graceful-warnings /tmp/phpcs.xml

      - name: Fail on WPCS errors
        run: phpcs --standard=.phpcs.xml.dist --runtime-set ignore_warnings_on_exit 1 -q --report=summary

  # Build the real release zip and assert what is in it.
  #
  # This runs the actual release gate rather than a copy of it, so a defect in the
  # gate surfaces in CI instead of at tag time. It also pins the packaging
  # contract: docker/ is 46MB of fixture material including two BuddyBoss Platform
  # zips, and shipping a paid third-party plugin inside our zip is the failure the
  # allowlist exists to prevent.
  package:
    name: Build release zip
    runs-on: ubuntu-latest
    needs: [ lint ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build
        # WPCS has its own job above; skip the borrowed-binary path here so the
        # build does not depend on a sibling checkout that does not exist in CI.
        run: PHPCS=/nonexistent bin/build-release.sh "$GITHUB_WORKSPACE/dist"

      - name: Assert package contents
        run: |
          ZIP="$(ls "$GITHUB_WORKSPACE"/dist/*.zip)"
          echo "built: $ZIP"
          fail=0

          # Nothing that is development material may ship.
          for forbidden in 'docker/' 'docs/' '\.md$' '\.git' 'phpcs' '\.zip$'; do
            if unzip -Z1 "$ZIP" | grep -Eq "$forbidden"; then
              echo "::error::forbidden entry matching '$forbidden' found in the zip"
              unzip -Z1 "$ZIP" | grep -E "$forbidden" | head
              fail=1
            fi
          done

          # The allowlist and the strip step are two independent ways to lose a
          # file, and losing one is silent - the zip builds, installs, and fails on
          # a customer's site mid-migration.
          for required in \
            'buddynext-importer/buddynext-importer.php' \
            'buddynext-importer/includes/Plugin.php' \
            'buddynext-importer/includes/Autoloader.php' \
            'buddynext-importer/includes/Pipeline/StepRegistry.php' \
            'buddynext-importer/includes/CLI/MigrateCommand.php' \
            'buddynext-importer/templates/admin/importer-page.php' \
            'buddynext-importer/assets/js/admin-importer.js'; do
            unzip -Z1 "$ZIP" | grep -qx "$required" || { echo "::error::missing from zip: $required"; fail=1; }
          done

          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: buddynext-importer-zip
          path: dist/*.zip
          if-no-files-found: error
